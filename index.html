<!DOCTYPE html>
<html>
       <head>
              <title>AI Test</title>
              <link rel="stylesheet" href="css/style.css">
       </head>

       <body>
              <h1>
                     AI Test
              </h1>

              <div id="flex-body">

                     <canvas id="main-canvas" class="large" width="800" height="600">

                     </canvas>
                     <canvas id="network-canvas" class="large" width="800" height="600">

                     </canvas>

                     <br>

                     <canvas id="generation-canvas" class="graph" width="800" height="200">

                     </canvas>

                     <div id="controls">

                            <div class="column">

                                   Render Simulation:
                                   <input type="checkbox" id="renderSimulationCheckbox"
                                          checked="true">
                                   <br>

                                   Sim Speed:
                                   <input type="range" id="speedSlider"
                                          min="1" max="100" value="10">

                                   <span id="speedLabel">1</span>

                                   <br>

                                   Substeps:
                                   <input type="range" id="substepSlider"
                                          min="1" max="10" value="5">

                                   <span id="substepLabel">5</span>

                                   <br>

                                   Show Only Leader:
                                   <input type="checkbox" id="showOnlyLeaderCheckbox"
                                          >

                                   <br>

                                   Non-Leader Opacity:
                                   <input type="range" id="nonLeaderOpacitySlider"
                                          min="0" max="100" value="50">

                                   <span id="nonLeaderOpacityLabel">0.50</span>

                                   <br>

                                   Stop at End of Generation:
                                   <input type="checkbox" id="stopAtGenerationCheckbox">

                            </div>

                            <div class="column">
                                   <button type="button" id="playButton"> play </button>
                                   <button type="button" id="pauseButton"> pause </button>
                                   <button type="button" id="stepButton"> sub step </button>
                                   <button type="button" id="quickStepButton"> full step </button>
                                   <br>
                                   <button type="button" id="resetButton"> reset </button>
                                   <button type="button" id="confirmResetButton" class="hide"> confirm? </button>
                                   <br>
                                   <button type="button" id="runGenerationButton">run 1 generation</button>
                            </div>

                     </div>

                     <br>

                     <canvas id="memory-canvas" class="graph wide" width="1620" height="200"></canvas>

                     <canvas id="output-canvas" class="graph wide" width="1620" height="200"></canvas>

                     <canvas id="linearM-canvas" class="graph wide" width="1620" height="200"></canvas>

                     <canvas id="angularM-canvas" class="graph wide" width="1620" height="200"></canvas>

                     <canvas id="instability-canvas" class="graph wide" width="1620" height="200"></canvas>

                     <canvas id="conditions-canvas" class="graph wide" width="1620" height="200"></canvas>

              </div>
       </body>
</html>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/sharedSimulation.js"></script>
<script src="js/agent.js"></script>
<script src="js/network.js"></script>
<script src="js/evolution.js"></script>
<script src="js/render.js"></script>
<script src="js/simulation.js"></script>
<script src="js/main.js"></script>
