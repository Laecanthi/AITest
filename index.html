<!DOCTYPE html>
<html>
    <head>
        <title>AI Test</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
    <h1>
        AI Test
    </h1>
    <canvas id="main-canvas" width="800" height="600">

    </canvas>
    <canvas id="network-canvas" width="800" height="600">

    </canvas>
    <br>
    <canvas id="graph-canvas" width="800" height="200">

    </canvas>

    <br>

    <div id="controls">

    Render Simulation:
    <input type="checkbox" id="renderSimulationCheckbox"
           checked="true">
    <br>

    Sim Speed:
    <input type="range" id="speedSlider"
           min="1" max="50" value="5">

    <span id="speedLabel">5</span>

    <br>

    Substeps:
    <input type="range" id="substepSlider"
           min="1" max="10" value="5">

    <span id="substepLabel">5</span>

    <br>

    Mutation Rate:
    <input type="range" id="mutationSlider"
           min="1" max="50" value="5">

    <span id="mutationLabel">0.05</span>

    <br>

    Generation Length:
    <input type="range" id="generationSlider"
           min="1" max="30" value="5">

    <span id="generationLabel">5</span>

    <br>

    Show Only Leader:
    <input type="checkbox" id="showOnlyLeaderCheckbox"
           >

    <br>

    Non-Leader Opacity:
    <input type="range" id="nonLeaderOpacitySlider"
           min="0" max="100" value="10">

    <span id="nonLeaderOpacityLabel">0.10</span>

</div>
</body>

</div>-->
</html>
